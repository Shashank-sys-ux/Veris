[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proven"
version = "1.1.0"
description = "Clause accounting, settlement arithmetic and evidence grading for Singapore SME insurance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# PINNED, not ranged. An unpinned range means the build that works today can break on
# demo day because a transitive dependency shipped a release overnight, and there is
# no version of that failure that is worth the convenience. Bump deliberately, re-run
# the suite, commit the new pin.
#
# Per-component open-source roles are declared in OPEN-SOURCE.md (T&C cl 9.6(c)).
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.34.0",
  "pydantic==2.12.4",
  "PyYAML==6.0.3",
  "pypdf==6.10.2",
  "python-multipart==0.0.22",  # required by FastAPI for multipart upload
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.155.6",
  "httpx==0.28.1",             # fastapi.testclient transport
]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python assets the engine loads at runtime. Without these the taxonomy and the
# rule files are missing from an installed package and every import fails at load.
[tool.setuptools.package-data]
proven = ["rules/*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `tests/` is on the path so tests can import the local pdfbuild helper, and `src/`
# is added by tests/conftest.py.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  # starlette's TestClient warns about httpx2; it is a transport detail of the test
  # harness and not something this project controls.
  "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
